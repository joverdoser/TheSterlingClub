<!--
  Print source for the business card. Two pages: front, then back.
  Page size is 3.75 x 2.25 in: a 3.5 x 2 in card plus 1/8 in bleed on every side.
  Keep text inside the safe area (1/4 in from the page edge).
  To rebuild the PDF, open this file in Chrome and print to PDF with
  "Background graphics" on and margins set to "None".
-->
<style>
  @font-face { font-family: "Libre Caslon Display"; src: url("../fonts/libre-caslon-display-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 400; src: url("../fonts/jost-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 500; src: url("../fonts/jost-latin-500-normal.woff2") format("woff2"); }
  @page { size: 3.75in 2.25in; margin: 0; }
  :root { --onyx: #0F0F0F; --white: #FFFFFF; --text: #E6E6E6; --silver: #A8A8A8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--onyx); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { position: relative; width: 3.75in; height: 2.25in; overflow: hidden; background: var(--onyx); color: var(--text); page-break-after: always; }
  .safe { position: absolute; inset: .25in; }
  svg { display: block; }

  /* Front: the mark and name, nothing else */
  .front .safe { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .front .mark { width: .5in; height: .82in; color: var(--white); }
  .front .the { display: flex; align-items: center; gap: .08in; margin-top: .14in; font: 6pt/1 "Libre Caslon Display", serif; letter-spacing: .4em; margin-right: -.4em; text-transform: uppercase; color: var(--silver); }
  .front .the::before, .front .the::after { content: ""; width: .32in; height: .5pt; background: var(--silver); }
  .front .name { margin-top: .07in; font: 10pt/1 "Libre Caslon Display", serif; letter-spacing: .26em; margin-right: -.26em; text-transform: uppercase; color: var(--white); }

  /* Back: contact details and a small QR code */
  .back .safe { display: grid; grid-template-columns: 1fr auto; column-gap: .2in; align-items: center; }
  .back h1 { font: 400 12.5pt/1.1 "Libre Caslon Display", serif; color: var(--white); }
  .back .tag { margin-top: .05in; font: 400 6.5pt/1.3 "Jost", sans-serif; color: var(--silver); }
  .back .rule { width: .42in; height: .5pt; background: var(--silver); margin: .12in 0 .1in; }
  .back ul { list-style: none; font: 400 7.5pt/1.55 "Jost", sans-serif; color: var(--text); }
  .back .qr { display: flex; flex-direction: column; align-items: center; gap: .05in; }
  .back .qr-box { width: .72in; height: .72in; padding: .05in; background: var(--white); border-radius: 2pt; }
  .back .qr-box svg { width: 100%; height: 100%; }
  .back .qr p { font: 400 5.5pt/1.2 "Jost", sans-serif; color: var(--silver); text-align: center; }

  /* On screen only: show the trim line so the layout can be checked */
  @media screen {
    body { display: flex; flex-direction: column; gap: 24px; padding: 24px; background: #3a3a3a; }
    .page::after { content: ""; position: absolute; inset: .125in; outline: 1px dashed rgba(255, 255, 255, .35); }
  }
</style>
